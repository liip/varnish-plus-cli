name: CI

on:
    push:
        branches:
            - "*.x"
    pull_request:

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        name: PHP ${{ matrix.php }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php:
                    - '8.1'
                    - '8.2'
                    - '8.3'

        steps:
            - name: Setup PHP
              uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none

            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                persist-credentials: false

            - name: Execute tests
              run: make phpcs

    zizmor:
        name: Run zizmor 🌈
        runs-on: ubuntu-latest
        permissions:
            security-events: write # required to upload results to advanced security
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Run zizmor 🌈
              uses: zizmorcore/zizmor-action@71321a20a9ded102f6e9ce5718a2fcec2c4f70d8 # v0.5.2

    dependabot-automerge:
        name: Auto-merge Dependabot PRs
        needs: # only on successful tests
            - tests
            - zizmor
        runs-on: ubuntu-latest

        permissions:
            pull-requests: write # needed so dependabot can approve
            contents: write # needed so dependabot can merge

        steps:
            - name: Auto-merge Dependabot PRs
              uses: fastify/github-action-merge-dependabot@30c3f8f14a4f7b315ba38dbc1b793d27128fef82 # v3
              with:
                  # only automerge patch & minor semver bumps
                  target: minor
