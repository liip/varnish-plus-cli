name: CI

on:
    push:
        branches:
            - 2.x
    pull_request:

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        name: PHP ${{ matrix.php }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php:
                    - '8.1'
                    - '8.2'
                    - '8.3'

        steps:
            - name: Setup PHP
              uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none

            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                persist-credentials: false

            - name: Execute tests
              run: make phpcs

    dependabot-automerge:
        name: Auto-merge Dependabot PRs
        needs: tests # only on successful tests
        runs-on: ubuntu-latest

        permissions:
            pull-requests: write # needed so dependabot can approve
            contents: write # needed so dependabot can merge

        steps:
            - name: Auto-merge Dependabot PRs
              uses: fastify/github-action-merge-dependabot@1b2ed42db8f9d81a46bac83adedfc03eb5149dff # v3
              with:
                  # only automerge patch & minor semver bumps
                  target: minor
